# Runs on every change to this server, before it can reach Render.
#
# On 30 August the owner's server shut itself down and he found out from
# an email hours later. The cause was a whole class of mistake -- a job
# that fails with nothing catching it ends the entire program -- and
# nothing existed to stop it being written again. This is that something.
# It is deliberately automatic: a check that depends on someone
# remembering to run it is not a safeguard.
name: Can this server shut itself down?

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  guard-check:
    runs-on: ubuntu-latest
    steps:
      # The whole history, not the last commit: the rollback checks run the
      # REAL older builds of this server (generation 1 = eb3880b, generation
      # 0 = 6cb24a4), written out of history, and a shallow copy has neither
      # (queue plan v14.1 rev 3.2, Q-T11; Deploy 2 plan v2, section 4).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A real Redis for the checks of the protected save (queue plan, 6.0
      # (L) and (CI)): each check starts its own on a private socket file and
      # stops it with SHUTDOWN NOSAVE. The one the package starts by itself
      # is stopped, so nothing else is answering.
      - name: Install a local Redis for the protected-save checks
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server
          sudo systemctl stop redis-server || true
          redis-server --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check nothing can end the whole server
        run: node guardCheck.js
      - name: Check every file still parses
        run: for f in *.js; do node --check "$f"; done
      - run: npm install --no-audit --no-fund
      # Every check in tests/, not a hand-picked list: twelve were named here
      # one by one and the other fifteen could break with nothing noticing.
      # The runner fails on a FAIL line or a stall as well as on a bad
      # ending, because the crash guard can let a half-finished check end
      # as a success.
      # REQUIRE_REAL_REDIS: a check that needs Redis and cannot find one is a
      # FAILURE here, never a quiet skip.
      - name: Run every check
        env:
          REQUIRE_REAL_REDIS: '1'
        run: node tests/run-all.js
