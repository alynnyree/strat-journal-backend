<!doctype html>
<!-- A STAND-IN FOR HIS TRADINGVIEW CHART, for the camera's rehearsal only.
     The background colour encodes the moment it was painted, so a picture
     the camera keeps can be read back to the tenth of a second:
       red   = tenths of a second, counted modulo 250
       green = seconds of the minute x 4
       blue  = which symbol is showing (SPY 40, IWM 200, QQQ 120, NIO 80)
     ?signedout=1 shows a "Sign in" button, as TradingView does when the
     session has lapsed. -->
<html><head><meta charset="utf-8"><title>fake chart</title></head>
<body style="margin:0;overflow:hidden">
<div id="b" style="position:fixed;inset:0"></div>
<div id="s" style="position:fixed;left:40px;top:40px;font:bold 120px sans-serif;color:#fff"></div>
<script>
const q = new URLSearchParams(location.search);
const sym = (q.get('symbol') || 'SPY').toUpperCase();
const code = { SPY: 40, IWM: 200, QQQ: 120, NIO: 80 }[sym] ?? 160;
document.getElementById('s').textContent = sym;
document.title = sym + ' chart';
const b = document.getElementById('b');
function tick() {
  const t = Date.now();
  b.style.background = `rgb(${Math.floor(t / 100) % 250},${(Math.floor(t / 1000) % 60) * 4},${code})`;
  requestAnimationFrame(tick);
}
tick();
if (q.get('signedout') === '1') document.body.insertAdjacentHTML('beforeend', '<button style="position:fixed;right:20px;top:20px;font-size:30px">Sign in</button>');
</script>
</body></html>
